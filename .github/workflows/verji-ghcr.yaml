name: Build and push image to GitHub Container Registry
on:
    workflow_dispatch: {}
    push:
        branches: [verji-develop]
        paths-ignore:
            - "**.md"
            - ".github/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref_name }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/verji-develop' }}

jobs:
    build-and-push:
        name: Build and push
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        env:
            REGISTRY: ghcr.io/verji
            # GITHUB_TOKEN reads @verji/* from GitHub Packages npm registry — auth granted via
            # each module package's "Manage Actions access" settings in GitHub UI.
            GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            # Fine-grained PAT with Contents:Read on the two private upstream repos
            # (verji/matrix-js-sdk-v2 and verji/matrix-react-sdk-module-api). Used by the
            # Docker build's `git insteadOf` to clone those repos. See VerjiModuleVersioning.md.
            VERJI_REPO_READ_PAT: ${{ secrets.VERJI_REPO_READ_PAT }}

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0 # full history needed by docker-package for version calculation
                  fetch-tags: true # `git describe --tags` inside the container needs the tags

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Compute short SHA
              id: sha
              run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

            - name: Build and push Docker image
              run: |
                  TAG="${{ steps.sha.outputs.short }}-${{ github.run_number }}"
                  IMAGE="${{ env.REGISTRY }}/element-web-v2"

                  docker build \
                    --secret id=gh_packages_token,env=GH_PACKAGES_TOKEN \
                    --secret id=verji_repo_read_pat,env=VERJI_REPO_READ_PAT \
                    --build-arg BUILD_ID=${{ github.run_number }} \
                    -t "${IMAGE}:${TAG}" \
                    -t "${IMAGE}:latest" \
                    -f Dockerfile.Verji \
                    .

                  docker push "${IMAGE}:${TAG}"
                  docker push "${IMAGE}:latest"

                  echo "### Published" >> "$GITHUB_STEP_SUMMARY"
                  echo "- \`${IMAGE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
                  echo "- \`${IMAGE}:latest\`" >> "$GITHUB_STEP_SUMMARY"
